<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Settle Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one framed stage like a print on a mat. Arrow rails on all four edges of the board, status line below. */
:root{
  --bg:#ECEAE6; --mat:#FBFAF8; --ink:#1B1A1F; --muted:#6B6872; --line:#D8D5CF;
  --accent:#3D5AFE; --accent-ink:#FFFFFF; --lock:#3D5AFE;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121216; --mat:#1C1C22; --ink:#ECEBF0; --muted:#9A98A6; --line:#2E2E37;
  --accent:#7C93FF; --accent-ink:#0B0D1A; --lock:#8FA2FF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121216; --mat:#1C1C22; --ink:#ECEBF0; --muted:#9A98A6; --line:#2E2E37;
  --accent:#7C93FF; --accent-ink:#0B0D1A; --lock:#8FA2FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:30px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--body);font-stretch:100%;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.count{text-align:right}
.count b{display:block;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:30px;line-height:1}
.count span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* stage: 3x3 grid, arrows on the edges, board in the middle */
.mat{background:var(--mat);border:1px solid var(--line);border-radius:16px;padding:8px}
.stage{--n:4;--gap:1px;--rail:34px;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--rail);grid-template-rows:var(--rail) auto var(--rail);gap:6px}
.rail{display:grid;gap:var(--gap)}
.rail.h{grid-template-columns:repeat(var(--n),1fr)}
.rail.v{grid-template-rows:repeat(var(--n),1fr)}
.top{grid-column:2;grid-row:1}.bottom{grid-column:2;grid-row:3}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
.arr{border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0;transition:background .12s,color .12s}
.arr:hover:not(:disabled){background:color-mix(in oklab,var(--accent) 12%,transparent);color:var(--accent)}
.arr:active:not(:disabled){background:color-mix(in oklab,var(--accent) 22%,transparent)}
.arr svg{width:18px;height:18px}
.board{grid-column:2;grid-row:2;position:relative;aspect-ratio:1/1;max-width:100%;touch-action:none}
.stage.solved{--gap:0px}
.t{position:absolute;left:0;top:0;width:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));height:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
  transform:translate(calc(var(--x) * (100% + var(--gap)) + var(--dx,0px)),calc(var(--y) * (100% + var(--gap)) + var(--dy,0px)));
  border:0;padding:0;background-color:var(--line);background-size:calc(var(--n) * 100%) calc(var(--n) * 100%);border-radius:2px;
  transition:transform .26s cubic-bezier(.3,.7,.3,1),width .5s,height .5s,border-radius .5s,filter .15s}
.stage.solved .t{border-radius:0;cursor:default}
.t:hover{filter:brightness(1.06)}
.t.dragging{transition:none;z-index:2;will-change:transform}
.board{overflow:hidden}
.t.ghost{pointer-events:none}
@media (max-width:600px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:0}
  .rail{display:none}
  .board{grid-column:1;grid-row:1}
  .mat{padding:4px;border-radius:12px}
  header{margin-bottom:10px}
}
.t.wrap{transition:none;animation:wrapin .26s ease-out}
@keyframes wrapin{from{opacity:0;scale:.82}to{opacity:1;scale:1}}
.t.locked::after{content:"";position:absolute;inset:0;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--lock),inset 0 0 0 2.5px color-mix(in oklab,var(--lock) 35%,transparent)}
.stage.solved .t::after{display:none}
.lk{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:5px;background:var(--lock);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.t.locked .lk{opacity:1}
.stage.solved .lk{opacity:0}
.lk svg{width:11px;height:11px}
.lk{display:none!important}
.t.anchor{cursor:default}
.t.anchor::after{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 2.5px color-mix(in oklab,var(--ink) 30%,transparent)}
.t.anchor .lk{background:var(--ink);border-radius:50%}
.t.anchor .lk svg{display:none}
.t.anchor .lk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mat)}
@media (prefers-reduced-motion:reduce){.t,.t.wrap{transition:none;animation:none}}

.controls{display:flex;gap:10px;margin-top:14px;align-items:center}
.primary{flex:1;height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-stretch:115%;font-size:17px;letter-spacing:.01em}
.ghost{height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--mat);font-weight:600;white-space:nowrap}
.ghost.test{border-style:dashed;color:var(--muted)}
.status{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}
.status span:last-child{text-align:right}
.status b{color:var(--ink)}

.intro h1{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:clamp(52px,16vw,84px);line-height:.9;letter-spacing:-.03em;margin:28px 0 12px}
.intro .date{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.intro p{color:var(--muted);margin:0 0 6px;max-width:44ch}
.steps{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--mat);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctas .primary{flex:0 1 auto;padding:0 22px}
.upload{position:relative;overflow:hidden;display:inline-grid;place-items:center}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgpick{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:10px;border:1px dashed var(--line);border-radius:14px;background:var(--mat)}
.imgpick img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.imgpick .ph{width:56px;height:56px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
.imgpick div{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.imgpick b{display:block;color:var(--ink);font-size:14.5px}

.result{margin-top:16px;background:var(--mat);border:1px solid var(--line);border-radius:16px;padding:18px}
.result h2{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:28px;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.result .sub{color:var(--muted);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:24px}
.share{width:100%;resize:none;border:1px dashed var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:14px;line-height:1.4;margin-bottom:12px}
.next{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.next b{color:var(--ink)}
.pt{margin-top:22px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;display:grid;gap:10px}
.pt-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--mat);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:7px;min-width:38px;height:32px;padding:0 10px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--ink);color:var(--bg)}
.pt-go{height:44px}
.pt-pic{display:flex;align-items:center;gap:8px}
.pt-pic img{width:36px;height:36px;border-radius:7px;object-fit:cover}
.pt-up{height:36px;font-size:13.5px;padding:0 12px}
.pt-note{margin:0;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:5}
</style>

</head>

<script>
let S,N,A;
{const q=new URLSearchParams(location.search),c=(typeof CONFIG!=='undefined'?CONFIG:{});const num=(v,d)=>{const n=parseInt(v,10);return Number.isFinite(n)?n:d};
 S=Math.max(4,Math.min(6,num(q.get('grid'),num(c.grid,5))));A=Math.max(0,Math.min(4,num(q.get('fixed'),num(c.fixedTiles,3))));N=S*S}const PX=750,START=new Date(2026,9,31);
const LOCK='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5.2" width="8" height="5.8" rx="1.2" fill="#fff"/><path d="M3.8 5.4V4a2.2 2.2 0 0 1 4.4 0v1.4" stroke="#fff" stroke-width="1.4" fill="none"/></svg>';
const CHEV=deg=>`<svg viewBox="0 0 20 20" aria-hidden="true" style="transform:rotate(${deg}deg)"><path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- seeded rng ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0}}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rngFor=(...p)=>mulberry32(xmur3(p.join('|'))());

/* ---------- dates + storage ---------- */
const now=new Date(),pad=n=>String(n).padStart(2,'0');
const DATEKEY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const DAILYNO=Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5)+1;
const DATELABEL=now.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const IMGKEY='settle-img',CFGKEY='settle-cfg';
const KEYFOR=()=>`settle-v9:${DATEKEY}:${S}x${A}`;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let G=null, IMG=EMBED, screen='intro', toast='', tileEls=null, lastPos=null, lastMove=null;

/* ---------- core move: slide one row or column, hopping over pinned tiles ---------- */
const range=()=>[...Array(S).keys()];
const lineCells=(axis,i)=>axis==='row'?range().map(c=>i*S+c):range().map(r=>r*S+i);
function shiftPerm(perm,lk,axis,i,dir){
  const free=lineCells(axis,i).filter(p=>!lk.has(p)),n=free.length;
  if(n<2)return false;
  const ids=free.map(p=>perm[p]);
  free.forEach((p,k)=>perm[free[(k+dir+n)%n]]=ids[k]);
  return true;
}
// scramble by playing random moves from the solved picture, so a solution of that length always exists
function newGame(seed,mode){
  const ar=rngFor(seed,'anchors'),anchors=[];
  for(const ry of [[0,1],[S-2,S-1]])for(const rx of [[0,1],[S-2,S-1]])anchors.push(ry[Math.floor(ar()*2)]*S+rx[Math.floor(ar()*2)]);
  for(let i=3;i>0;i--){const j=Math.floor(ar()*(i+1));[anchors[i],anchors[j]]=[anchors[j],anchors[i]]}
  anchors.splice(A);anchors.sort((a,b)=>a-b);
  // scramble with real moves until no tile is home and no two true neighbors sit together.
  // if a layout makes that impossible, allow one neighbor pair; deterministic retries keep it the same for everyone.
  const lk=new Set(anchors),need=N-anchors.length;
  const goodPairs=pm=>{let c=0;for(let p=0;p<N;p++){const t=pm[p];
    if(p%S<S-1&&t%S<S-1&&pm[p+1]===t+1)c++;
    if(p+S<N&&pm[p+S]===t+S)c++}return c};
  let perm=null,fallback=null;
  for(let attempt=0;attempt<300&&!perm;attempt++){
    const maxPairs=attempt<40?0:1,r=rngFor(seed,'scramble',attempt);
    const pm=[...Array(N).keys()];let moves=0,last=null;
    const displaced=()=>pm.filter((t,p)=>t!==p).length;
    const ok=()=>displaced()===need&&goodPairs(pm)<=maxPairs;
    while((moves<2*S-2||!ok())&&moves<60){
      const axis=r()<.5?'row':'col',i=Math.floor(r()*S),dir=r()<.5?-1:1;
      if(last&&last.axis===axis&&last.i===i&&last.dir===-dir)continue;
      if(!shiftPerm(pm,lk,axis,i,dir))continue;
      moves++;last={axis,i,dir};
    }
    if(ok())perm=pm;
    else if(displaced()===need&&(!fallback||goodPairs(pm)<goodPairs(fallback)))fallback=pm;
  }
  perm=perm||fallback||[...Array(N).keys()];
  return {seed,mode,perm,anchors,locked:anchors.slice(),moves:0,unpins:0,penalty:0,lastWrong:null,mispinned:[],solved:false};
}
const isSolved=()=>G.perm.every((t,p)=>t===p);
const PT_SEED=new URLSearchParams(location.search).get('seed')||(typeof CONFIG!=='undefined'&&CONFIG.seed)||'playtest-valley-1',PT_KEY='settle-pt:'+PT_SEED+':'+S+'x'+A;
const save=()=>{if(G)store.set(PT_KEY,G)};

function move(axis,i,dir){
  if(G.solved)return;
  if(!shiftPerm(G.perm,new Set(G.locked),axis,i,dir))return;
  G.moves++;lastMove={axis,dir};
  if(isSolved()){G.solved=true;G.locked=[...Array(N).keys()]}
  save();update();lastMove=null;
}
function tap(p){
  if(G.solved)return;
  if(G.anchors.includes(p)){flash('This tile starts fixed in place.');return}
  const i=G.locked.indexOf(p);
  if(i>=0){G.locked.splice(i,1);G.unpins++;G.lastWrong=null}
  else{G.locked.push(p);if(G.perm[p]!==p&&!G.mispinned.includes(p))G.mispinned.push(p)}
  save();update();
}
function commit(){
  if(G.solved||G.locked.length<N)return;
  if(isSolved()){G.solved=true;save();update();return}
  G.lastWrong=G.perm.filter((t,p)=>t!==p).length;G.moves+=3;G.penalty+=3;
  save();update();
}
function unpinAll(){
  const n=G.locked.length-G.anchors.length;if(n<=0||G.solved)return;
  G.unpins+=n;G.locked=G.anchors.slice();G.lastWrong=null;save();update();
}
function flash(msg){toast=msg;update();clearTimeout(flash.t);flash.t=setTimeout(()=>{toast='';update()},1500)}

/* ---------- share ---------- */
function shareText(){
  const head='Settle · Playtest';
  let grid='';
  for(let y=0;y<S;y++){for(let x=0;x<S;x++){const p=y*S+x;grid+=G.anchors.includes(p)?'⬜':G.mispinned.includes(p)?'🟨':'🟩'}grid+='\n'}
  return `${head} · ${S}×${S}\nSettled in ${G.moves} moves${G.penalty?` (incl. +${G.penalty} penalty)`:''}\n${grid.trim()}`;
}
function countdown(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;return `${pad(Math.floor(t/36e5))}:${pad(Math.floor(t/6e4)%60)}:${pad(Math.floor(t/1e3)%60)}`}

/* ---------- views ---------- */
function viewIntro(){
  const saved=store.get(KEYFOR()),done=saved&&saved.solved,resume=saved&&!saved.solved;
  return `<section class="intro">
    <div class="date">Daily #${DAILYNO} · ${DATELABEL}</div>
    <h1>Settle</h1>
    <p>Your picture, cut into ${N} tiles and scrambled. Slide rows and columns until every tile settles home.</p>
    <ol class="steps">
      <li><i>1</i><span>Tap an arrow on any edge, or swipe a row or column, to slide it. Tiles that leave one side come back on the other.</span></li>
      <li><i>2</i><span>Tap a tile to pin it once it's home. Pinned tiles stay put and the rest of the line slides past them. Four start fixed.</span></li>
      <li><i>3</i><span>Everyone gets the same scramble today. Fewest moves wins.</span></li>
    </ol>
    <div class="imgpick">
      ${IMG?`<img src="${IMG}" alt="Your picture">`:`<span class="ph" aria-hidden="true">+</span>`}
      <div><b>${IMG?'Your picture':'Add a picture to play'}</b>Square works best. It's cropped to the center.</div>
      <label class="ghost upload">${IMG?'Change':'Upload'}<input type="file" accept="image/*" data-upload="1" aria-label="Upload a picture"></label>
    </div>
    <div class="ctas">
      <button class="primary" data-act="${done||resume?'resume':'start'}" ${IMG?'':'disabled'}>${done?"See today's result":resume?`Continue · ${saved.moves} moves`:"Play today's scramble"}</button>
      <button class="ghost" data-act="practice" ${IMG?'':'disabled'}>Practice</button>
    </div>
    ${done?`<p class="next">You've settled today's scramble. Next one in <b id="cd">${countdown()}</b>.</p>`:''}
  </section>`;
}
function viewGameShell(){
  const rail=(cls,axis,dir,deg,label)=>`<div class="rail ${cls} ${axis==='row'?'v':'h'}">${range().map(i=>`<button class="arr" data-act="move" data-arg="${axis}:${i}:${dir}" aria-label="${label} ${i+1}">${CHEV(deg)}</button>`).join('')}</div>`;
  return `<header>
      <div class="brand"><small id="label"></small>Settle</div>
      <div class="count num"><b id="moves">0</b><span>Moves</span></div>
    </header>
    <div class="mat"><div class="stage" id="stage" style="--n:${S}">
      ${rail('top','col',-1,90,'Slide up column')}
      ${rail('left','row',-1,0,'Slide left row')}
      <div class="board" id="board"></div>
      ${rail('right','row',1,180,'Slide right row')}
      ${rail('bottom','col',1,270,'Slide down column')}
    </div></div>
    <div id="below"></div>
    <div id="playtest"></div>
    <div id="toast"></div>`;
}
function viewBelow(){
  if(G.solved)return viewResult();
  const allPinned=G.locked.length===N;
  const hint=allPinned?(G.lastWrong?`<b>${G.lastWrong} tiles are in the wrong spot.</b> +3 moves. Unpin the suspects.`:'Everything is pinned. Commit to check.')
    :G.moves===0?'Tap an arrow or swipe a line. Tap a tile to pin it.':`${N-G.locked.length} tiles loose`;
  return `<div class="controls">
      ${allPinned?`<button class="primary" data-act="commit">Commit</button>`:''}
      <button class="ghost" data-act="unpinAll" ${G.locked.length>G.anchors.length?'':'disabled'}>Unpin all</button>
      <button class="ghost test" data-act="rescramble" title="Testing only">Rescramble</button>
    </div>
    <div class="status num"><span>Pinned <b>${G.locked.length}</b> / ${N}</span><span>${hint}</span></div>`;
}
function viewResult(){
  const verdict=`Settled in ${G.moves} moves.`;
  return `<div class="result">
    <h2>${verdict}</h2>
    <p class="sub">${G.mode==='daily'?'Everyone got this exact scramble today, so your move count is directly comparable.':'Practice scramble. Rescramble or tweak the settings below to try another.'}</p>
    <div class="stats num">
      <div class="stat"><small>Moves</small><b>${G.moves}</b></div>
      <div class="stat"><small>Wrong pins</small><b>${G.mispinned.length}</b></div>
      <div class="stat"><small>Unpins</small><b>${G.unpins}</b></div>
    </div>
    <textarea id="sharebox" class="share num" rows="7" readonly>${shareText()}</textarea>
    <div class="ctas">
      <button class="primary" data-act="copy">Copy result</button>
      <button class="ghost" data-act="practice">Practice</button>
      <button class="ghost" data-act="home">Change picture</button>
      <button class="ghost test" data-act="rescramble" title="Testing only">Rescramble</button>
    </div>
    ${G.mode==='daily'?`<p class="next">Same scramble for everyone today. Next one in <b id="cd">${countdown()}</b>.</p>`:''}
  </div>`;
}

function viewPlaytest(){
  const seg=(act,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="${act}" data-arg="${v}" class="${v===cur?'on':''}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;
  return `<div class="pt">
    <div class="pt-h">Playtest only</div>
    <div class="pt-row"><span>Grid</span>${seg('size',[[4,'4×4'],[5,'5×5']],S)}</div>
    <div class="pt-row"><span>Fixed tiles</span>${seg('fixed',[[0,'0'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],A)}</div>
    <div class="pt-row"><span>Picture</span><span class="pt-pic"><img src="${IMG}" alt="Current picture"><label class="ghost upload pt-up">Upload new<input type="file" accept="image/*" data-upload="1" aria-label="Upload a new picture"></label></span></div>
    <button class="ghost pt-go" data-act="rescramble">Rescramble</button>
    <p class="pt-note">Changing grid or fixed tiles starts a new practice scramble. A new picture swaps in on the current board.</p>
  </div>`;
}

/* ---------- rendering: tiles stay in the DOM so moves can slide ---------- */
const app=document.getElementById('app');
function buildBoard(){
  app.innerHTML=viewGameShell();
  const board=document.getElementById('board');
  tileEls=[];lastPos=[];
  for(let t=0;t<N;t++){
    const el=document.createElement('button');
    el.className='t';el.dataset.act='tap';
    el.style.backgroundImage=`url(${IMG})`;
    el.style.backgroundPosition=`${(t%S)*100/(S-1)}% ${Math.floor(t/S)*100/(S-1)}%`;
    el.innerHTML=`<span class="lk">${LOCK}</span>`;
    board.appendChild(el);tileEls.push(el);lastPos.push(-1);
  }
  ghost=document.createElement('div');ghost.className='t ghost dragging';ghost.hidden=true;
  ghost.style.backgroundImage=`url(${IMG})`;board.appendChild(ghost);
  bindSwipe(board);
}
function update(){
  if(screen!=='game'){app.innerHTML=viewIntro();return}
  const lk=new Set(G.locked);
  G.perm.forEach((t,p)=>{
    const el=tileEls[t],x=p%S,y=Math.floor(p/S),prev=lastPos[t];
    el.dataset.arg=p;
    el.classList.remove('wrap');
    if(jumpSet.has(t)){void el.offsetWidth;el.classList.add('wrap')}
    if(prev>=0&&prev!==p&&lastMove){
      const px=prev%S,py=Math.floor(prev/S);
      const wrapped=lastMove.axis==='row'?Math.sign(x-px)===-lastMove.dir:Math.sign(y-py)===-lastMove.dir;
      if(wrapped){void el.offsetWidth;el.classList.add('wrap')}
    }
    el.style.setProperty('--x',x);el.style.setProperty('--y',y);
    el.classList.toggle('locked',lk.has(p));
    el.classList.toggle('anchor',G.anchors.includes(p));
    el.setAttribute('aria-pressed',lk.has(p));
    el.setAttribute('aria-label',`Tile at row ${y+1}, column ${x+1}${G.anchors.includes(p)?', fixed':lk.has(p)?', pinned':''}`);
    lastPos[t]=p;
  });
  document.querySelectorAll('.arr').forEach(b=>{
    const [axis,i]=b.dataset.arg.split(':');
    b.disabled=G.solved||lineCells(axis,+i).filter(p=>!lk.has(p)).length<2;
  });
  document.getElementById('stage').classList.toggle('solved',G.solved);
  document.getElementById('moves').textContent=G.moves;
  document.getElementById('label').textContent=`Playtest · ${S}×${S}`;
  document.getElementById('below').innerHTML=viewBelow();
  document.getElementById('playtest').innerHTML=viewPlaytest();
  document.getElementById('toast').innerHTML=toast?`<div class="toast" role="status">${toast}</div>`:'';
}
// finger/mouse drag: the whole line follows your finger continuously (wrapping around the edge),
// then settles on the nearest step when you let go. Each step counts as one move.
let drag=null,suppressUntil=0,jumpSet=new Set(),ghost=null,raf=0;
const axisCoord=(axis,p)=>axis==='row'?p%S:Math.floor(p/S);
function renderDrag(){
  raf=0;const dg=drag;if(!dg||!dg.free)return;
  const n=dg.free.length,coords=dg.free.map(p=>axisCoord(dg.axis,p));
  let ghostOn=false;dg.vis={};
  dg.ids.forEach((t,k)=>{
    const f=(((k+dg.s)%n)+n)%n,k0=Math.floor(f),fr=f-k0;
    const a=coords[k0],b=k0+1<n?coords[k0+1]:coords[0]+S,pos=a+(b-a)*fr;
    dg.vis[t]=pos;
    const el=tileEls[t];
    el.style.setProperty(dg.axis==='row'?'--x':'--y',pos);
    if(pos>S-1){
      ghostOn=true;
      ghost.style.backgroundPosition=el.style.backgroundPosition;
      ghost.style.setProperty(dg.axis==='row'?'--x':'--y',pos-S);
      ghost.style.setProperty(dg.axis==='row'?'--y':'--x',dg.i);
    }
  });
  ghost.hidden=!ghostOn;
}
function bindSwipe(board){
  board.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.t');if(!t||t===ghost||!G||G.solved)return;
    const r=t.getBoundingClientRect(),br=board.getBoundingClientRect();
    drag={x:e.clientX,y:e.clientY,p:+t.dataset.arg,id:e.pointerId,axis:null,s:0,pitch:(br.width+parseFloat(getComputedStyle(board).getPropertyValue('--gap')||0))/S||r.width};
  });
  board.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.axis){
      if(Math.max(Math.abs(dx),Math.abs(dy))<6)return;
      drag.axis=Math.abs(dx)>Math.abs(dy)?'row':'col';
      drag.i=drag.axis==='row'?Math.floor(drag.p/S):drag.p%S;
      try{board.setPointerCapture(e.pointerId)}catch(_){}
      const lk=new Set(G.locked),free=lineCells(drag.axis,drag.i).filter(q=>!lk.has(q));
      if(free.length<2){drag.dead=true;return}
      drag.free=free;drag.ids=free.map(q=>G.perm[q]);
      drag.ids.forEach(t=>tileEls[t].classList.add('dragging'));
      // measure from here so the line doesn't jump by the dead-zone distance
      drag.x=e.clientX;drag.y=e.clientY;
    }
    if(drag.dead)return;
    drag.s=(drag.axis==='row'?e.clientX-drag.x:e.clientY-drag.y)/drag.pitch;
    if(!raf)raf=requestAnimationFrame(renderDrag);
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dg=drag;drag=null;
    if(!dg.axis)return;
    suppressUntil=Date.now()+350;
    if(raf){cancelAnimationFrame(raf);raf=0}
    ghost.hidden=true;
    if(dg.dead)return;
    let steps=e.type==='pointercancel'?0:Math.round(dg.s);
    if(!steps&&Math.abs(dg.s)>.3)steps=Math.sign(dg.s);
    dg.ids.forEach(t=>tileEls[t].classList.remove('dragging'));
    const lk=new Set(G.locked),dir=Math.sign(steps);
    for(let k=0;k<Math.abs(steps);k++)shiftPerm(G.perm,lk,dg.axis,dg.i,dir);
    // tiles that would have to glide the long way across the board just pop into place instead
    jumpSet=new Set();
    if(dg.vis)G.perm.forEach((t,p)=>{if(dg.vis[t]!==undefined&&Math.abs(axisCoord(dg.axis,p)-dg.vis[t])>1.01)jumpSet.add(t)});
    if(steps){G.moves+=Math.abs(steps);if(isSolved()){G.solved=true;G.locked=[...Array(N).keys()]}}
    save();update();jumpSet=new Set();
  };
  board.addEventListener('pointerup',end);
  board.addEventListener('pointercancel',end);
}
function begin(game){G=game;screen='game';buildBoard();update();window.scrollTo({top:0})}
const actions={
  start(){begin(newGame(PT_SEED,'playtest'));save()},
  restart(){if(!G.solved&&G.moves>0&&Date.now()>armedUntil){armedUntil=Date.now()+3000;update();setTimeout(()=>{if(G)update()},3050);return}
    armedUntil=0;const r=(G.restarts||0)+1;begin(newGame(PT_SEED,'playtest'));G.restarts=r;save()},
  resume(){begin(store.get(PT_KEY))},
  rescramble(){begin(newGame('practice-'+Math.random().toString(36).slice(2),'practice'))},
  size(n){S=+n;N=S*S;store.set(CFGKEY,{S,A});actions.rescramble()},
  fixed(a){A=+a;store.set(CFGKEY,{S,A});actions.rescramble()},
  rescramble(){if(!IMG)return;begin(newGame('practice-'+Math.random().toString(36).slice(2),'practice'))},
  practice(){if(!IMG)return;begin(newGame('practice-'+Math.random().toString(36).slice(2),'practice'))},
  home(){screen='intro';G=null;update()},
  tap(p){if(Date.now()<suppressUntil)return;tap(+p)},
  move(arg){const [axis,i,dir]=arg.split(':');move(axis,+i,+dir)},
  commit(){commit()},
  unpinAll(){unpinAll()},
  copy(){
    const txt=shareText()+(G.restarts?`\nRestarts: ${G.restarts}`:''),box=document.getElementById('sharebox');
    try{navigator.clipboard.writeText(txt).then(()=>flash('Copied'),()=>box.select())}catch(e){box.select()}
  },
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;actions[b.dataset.act]?.(b.dataset.arg)});
app.addEventListener('change',e=>{
  const inp=e.target.closest('[data-upload]');if(!inp||!inp.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const cv=document.createElement('canvas');cv.width=cv.height=PX;const g=cv.getContext('2d');
    const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,PX,PX);
    IMG=cv.toDataURL('image/jpeg',.88);store.set(IMGKEY,IMG);inp.value='';
    if(screen==='game'&&G){buildBoard();update();flash('New picture loaded')}else update();
  };im.src=fr.result};
  fr.readAsDataURL(inp.files[0]);
});

/* ---------- playtest build: fixed picture, 5x5, 3 fixed tiles, one seed ---------- */
let armedUntil=0;
function viewIntro(){
  const saved=store.get(PT_KEY),done=saved&&saved.solved,resume=saved&&!saved.solved;
  return `<section class="intro">
    <div class="date">Playtest · ${S}×${S}</div>
    <h1>Settle</h1>
    <p>A picture, cut into ${N} tiles and scrambled. Slide rows and columns until every tile settles home, in as few moves as you can.</p>
    <ol class="steps">
      <li><i>1</i><span>Drag a row or column with your finger. On a computer you can also use the arrows on the edges. Tiles that leave one side come back on the other.</span></li>
      <li><i>2</i><span>Tap a tile to pin it once it's home. Pinned tiles stay put, and the rest of the line slides past them.${A?` ${["","One tile starts","Two tiles start","Three tiles start","Four tiles start"][A]} fixed.`:""}</span></li>
      <li><i>3</i><span>When everything is pinned, commit to check. Fewest moves wins.</span></li>
    </ol>
    <div class="ctas"><button class="primary" data-act="${done||resume?'resume':'start'}">${done?'See your result':resume?`Continue · ${saved.moves} moves`:'Start'}</button></div>
  </section>`;
}
function viewPlaytest(){return ''}
function viewBelow(){
  if(G.solved)return viewResult();
  const allPinned=G.locked.length===N,armed=Date.now()<armedUntil;
  const hint=allPinned?(G.lastWrong?`<b>${G.lastWrong} tiles are in the wrong spot.</b> +3 moves. Unpin the suspects.`:'Everything is pinned. Commit to check.')
    :G.moves===0?'Drag a row or column. Tap a tile to pin it.':`${N-G.locked.length} tiles loose`;
  return `<div class="controls">
      ${allPinned?`<button class="primary" data-act="commit">Commit</button>`:''}
      <button class="ghost" data-act="unpinAll" ${G.locked.length>G.anchors.length?'':'disabled'}>Unpin all</button>
      <button class="ghost" data-act="restart">${armed?'Tap again to restart':'Restart'}</button>
    </div>
    <div class="status num"><span>Pinned <b>${G.locked.length}</b> / ${N}</span><span>${hint}</span></div>`;
}
function viewResult(){
  return `<div class="result">
    <h2>Settled in ${G.moves} moves.</h2>
    <p class="sub">Thanks for playtesting. Copy your result and send it back.</p>
    <div class="stats num">
      <div class="stat"><small>Moves</small><b>${G.moves}</b></div>
      <div class="stat"><small>Unpins</small><b>${G.unpins}</b></div>
      <div class="stat"><small>Wrong pins</small><b>${G.mispinned.length}</b></div>
    </div>
    <textarea id="sharebox" class="share num" rows="7" readonly>${shareText()}${G.restarts?`\nRestarts: ${G.restarts}`:''}</textarea>
    <div class="ctas">
      <button class="primary" data-act="copy">Copy result</button>
      <button class="ghost" data-act="restart">Play again</button>
    </div>
  </div>`;
}
setInterval(()=>{const el=document.getElementById('cd');if(el)el.textContent=countdown()},1000);
update();
</script>
